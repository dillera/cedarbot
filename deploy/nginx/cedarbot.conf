# CedarBot — nginx reverse proxy
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# sudo ln -s /etc/nginx/sites-available/cedarbot.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name cedarbot.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cedarbot.yourdomain.com;

    # ── TLS (Let's Encrypt / certbot) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/cedarbot.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cedarbot.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Upload size limit ────────────────────────────────────────────
    client_max_body_size 25m;

    # ── Proxy defaults ───────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;     # LLM calls can be slow

    # ── Next.js frontend (port 3000) ─────────────────────────────────
    # Serves the UI and also proxies /api/* to the backend internally,
    # so all traffic goes through Next.js.
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # ── Optional: expose backend health check directly ───────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Rate-limit the expensive endpoints ───────────────────────────
    # Chat — 10 requests/min per IP
    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
    }

    # PDF upload — 5 requests/min per IP
    location = /api/upload-pdf {
        limit_req zone=upload burst=2 nodelay;
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 180s;
    }

    # Policy management — tighter limit
    location /api/policies/ {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # ── Static assets — long cache ───────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny dotfiles ────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
